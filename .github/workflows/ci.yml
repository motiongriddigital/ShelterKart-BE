# ShelterKart CI (blind-spot review #1): the logic tests, then the first REAL run -- real dependencies, a real
# PostgreSQL, the nine migrations, the price-book seed, the server, and the smoke test against it.
name: ci
on: [push, pull_request]
jobs:
  logic:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
  real-run:
    runs-on: ubuntu-latest
    needs: logic
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: shelterkart }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/shelterkart
      NODE_ENV: production
      PORT: '3000'
      ALLOWED_ORIGINS: https://ci.shelterkart.invalid
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-admin-password-not-secret
      ACCESS_TOKEN_SECRET: ci-access-token-secret
      QUOTE_SECRET: ci-quote-secret
      PAYMENT_WEBHOOK_SECRET: ci-webhook-secret
      RAZORPAY_WEBHOOK_SECRET: ci-webhook-secret
      SMOKE_WEBHOOK_SECRET: ci-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
        working-directory: backend
      - name: Apply the migrations
        run: node tools/migrate.js
      - name: "Re-run the migrations: nothing may apply twice"
        run: node tools/migrate.js | tee /tmp/second.txt && grep -q "0 applied, 18 already applied" /tmp/second.txt
      - name: Every foreign key is indexed or allow-listed
        run: node tools/check_fk_indexes.js
      - name: Seed the pricing reference tables
        run: node tools/seed_pricing.js
      - name: Start the real server
        run: (node backend/server.js > /tmp/server.log 2>&1 &) && for i in $(seq 1 30); do curl -sf localhost:3000/api/health && break; sleep 1; done
      - name: Smoke test the real server
        run: node tools/smoke.js http://localhost:3000
      - name: Start a second server with user accounts on
        env:
          NODE_ENV: development
          PORT: '3001'
          ACCOUNTS_ENABLED: 'on'
          AUTH_PEPPER: ci-pepper-not-a-secret-0123456789abcdef
          ACCOUNTS_DEV_ECHO: 'on'
          ACCOUNTS_CSRF: 'on'
          API_VALIDATION: enforce
          API_VALIDATION_ENFORCE: /api/auth,/api/me
          ALLOWED_ORIGINS: 'http://localhost:5173'
        run: (node backend/server.js > /tmp/server-accounts.log 2>&1 &) && for i in $(seq 1 30); do curl -sf localhost:3001/api/health && break; sleep 1; done
      - name: Smoke test sign-in, sessions and the wall against the real database
        run: node tools/smoke_accounts.js http://localhost:3001
      - name: Server log on failure
        if: failure()
        run: cat /tmp/server.log /tmp/server-accounts.log
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: shelterkart-be:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and wait for its health route
        run: |
          docker run -d --name api -p 4000:4000 -e NODE_ENV=development shelterkart-be:ci
          for i in $(seq 1 30); do curl -sf localhost:4000/api/health && exit 0; sleep 1; done
          docker logs api
          exit 1
