  /api/payments/mor/webhook:
    post:
      operationId: merchantOfRecordWebhook
      tags: [Webhooks]
      summary: Merchant of Record (Dodo Payments) webhook
      description: |
        Verified over the exact raw body with the Standard Webhooks scheme: the `webhook-id`, `webhook-timestamp` and `webhook-signature` headers, with a five minute tolerance
        on the timestamp, against `DODO_WEBHOOK_KEY`. The route has its own raw body parser (1 mb) and the global JSON parser is skipped for this path.
        No JSON parser may sit in front of this route.

        Once the signature is valid the route answers 200. De-duplicated by the `webhook-id` header. It can only confirm the quote's total: the same currency and the same amount in the
        smallest unit, or nothing unlocks (`mismatch: true`). Only `payment.succeeded` settles a purchase; `payment.failed` and `refund.*` are recorded and answered with `noted`.
        A paid event without a usable purchase id in its metadata is recorded as unmatched (`unmatched: true`) and is settled later by the buyer's return (`POST /api/research/access`).
        A request whose `Content-Type` is not `application/json` is not parsed and answers 401. The request body is a Dodo event; its shape is Dodo's and is not documented here.
      security:
        - morWebhookSignature: []
      x-source: backend/server.js:944
      parameters:
        - name: webhook-id
          in: header
          required: true
          schema: {type: string}
        - name: webhook-timestamp
          in: header
          required: true
          description: Unix time in seconds.
          schema: {type: string}
      requestBody:
        required: true
        description: The raw Dodo event JSON, byte for byte.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 'Accepted. Flags: `ignored` (the event type), `duplicate`, `noted` (the event type), `unmatched`, `unknown_purchase`, `mismatch`, or none (processed).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookAck'}
        '400':
          description: 'The body is not valid JSON. The body is `{ "ok": false }`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean, const: false}
        '401':
          description: The signature headers are missing, stale or do not match.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/OriginNotAllowed'}
        '503':
          description: '`DODO_WEBHOOK_KEY` is not set. The body is `{ "ok": false }`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean, const: false}
  /api/payments/webhook:
    post:
      operationId: genericPaymentWebhook
      tags: [Webhooks]
      summary: Generic signed payment webhook (non-Razorpay provider)
      description: |
        The route has its own raw body parser (1 mb) and the global JSON parser is skipped for this path. The signature is an HMAC-SHA256 hex digest of the exact raw bytes, sent in
        `x-sk-signature`, compared in constant time against `PAYMENT_WEBHOOK_SECRET`. No JSON parser may sit in front of this route.
        `x-sk-provider` names the provider (default `unknown`) and is stored as the purchase's provider.

        Unlike the other two webhooks, the event is logged before the signature is judged, so a rejected signature leaves an `ignored` row as an audit trail, and the order of answers is:
        503 (no secret), 400 (not JSON, or no `id`), 200 `duplicate` (the `(provider, id)` pair was seen), 401 (bad signature), 200 `ignored` (type other than `payment.succeeded`),
        then settlement.

        A `payment.succeeded` event must carry `data.reportRef` (a report reference), `data.purchaseId` (a UUID) and `data.amount` (a number not below the stored purchase amount).
        Anything else, including an unknown purchase type, answers 400 "Could not process payment event".
        Nothing in the frontend calls this route. Which provider uses it is not stated in the code; `.env.example` says it is "only for a non-Razorpay provider".

        Known defect observed while writing this contract (not fixed here): the handler is an `async` function with no error handling around the signature step.
        If the request's `Content-Type` is not `application/json`, `express.raw` leaves the body unparsed, `crypto.createHmac(...).update(req.body)` throws a TypeError,
        Express 4 does not catch it, and on Node 23 the whole server process exited (verified locally with `PAYMENT_WEBHOOK_SECRET` set).
        The Razorpay and merchant webhooks answer 401 in the same situation. Providers should send `application/json`.
      security:
        - genericWebhookSignature: []
      x-source: backend/server.js:1317
      parameters:
        - name: x-sk-provider
          in: header
          required: false
          schema: {type: string}
      requestBody:
        required: true
        description: The raw event JSON, byte for byte.
        content:
          application/json:
            schema:
              type: object
              required: [id, type]
              properties:
                id: {type: string, description: Event id. Used for replay protection.}
                type: {type: string, description: 'Only `payment.succeeded` is acted on.'}
                data:
                  type: object
                  properties:
                    reportRef: {$ref: '#/components/schemas/ReportRef'}
                    purchaseId: {type: string, format: uuid}
                    amount: {type: number}
      responses:
        '200':
          description: 'Accepted: processed, `duplicate: true`, or `ignored` (the event type).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookAck'}
        '400':
          description: '"Malformed payload", "Missing event id", "Amount does not match report price" or "Could not process payment event".'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: '"Invalid signature"'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/OriginNotAllowed'}
        '500':
          description: '"Event log failed"'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: '`PAYMENT_WEBHOOK_SECRET` is not set. The body is `{ "ok": false }`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean, const: false}
