  /api/payments/razorpay/webhook:
    post:
      operationId: razorpayWebhook
      tags: [Webhooks]
      summary: Razorpay payment webhook
      description: |
        The backstop if the buyer closes the tab before the checkout handler runs. The route has its own raw body parser (`express.raw`, type `application/json`, 1 mb)
        and the global JSON parser is skipped for this path. The signature is an HMAC-SHA256 hex digest of the exact raw bytes, compared in constant time
        against `RAZORPAY_WEBHOOK_SECRET`. No JSON parser may sit in front of this route (including a proxy or middleware that re-serialises the body), or the bytes change
        and every signature fails.

        Once the signature is valid the route answers 200 so Razorpay does not retry forever; what it did is in the body. Events handled: `payment.captured` and `order.paid`.
        Redeliveries are detected by `(provider, event_id)` in `payment_events`. A payment whose currency or amount in subunits differs from the stored purchase by even one unit
        does not unlock anything (`mismatch: true`). Any other event is acknowledged with `ignored`.
        A request whose `Content-Type` is not `application/json` is not parsed and answers 401. The request body is a Razorpay event; its shape is Razorpay's and is not documented here.
      security:
        - razorpayWebhookSignature: []
      x-source: backend/server.js:899
      requestBody:
        required: true
        description: The raw Razorpay event JSON, byte for byte.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 'Accepted. The flags are mutually exclusive: `ignored` (the event name), `duplicate`, `unknown_order`, `mismatch`, or none (processed).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookAck'}
        '400':
          description: 'The body is not valid JSON. The body is `{ "ok": false }`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean, const: false}
        '401':
          description: The signature is missing or does not match.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/OriginNotAllowed'}
        '503':
