    post:
      operationId: startInvestigation
      tags: [Investigate]
      summary: Start (or reuse) an investigation and get its report reference
      description: |
        Names a property. The free preview runs the first sweep in the background and the paid report continues it after payment. Every investigation is stored under a normal
        report ref, so quote, checkout, verification, webhooks and access tokens serve it unchanged. The same project (same words in name and location, same country) is reused for 30 days
        and returns 200 with `reused: true`.

        Order of checks: input (400), research paused (503 `paused`), reuse (200), proof of work (428), daily and per-market caps and the AI daily maximum (503 `paused`),
        concurrency (429), then the job starts (202).
      security: []
      x-rate-limit: researchLimiter
      x-source: backend/server.js:714
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: {type: string, minLength: 3, maxLength: 120}
                location: {type: string, maxLength: 120}
                country: {type: string, description: ISO 3166 alpha-2 code of the project's country. Used as the investigation's market.}
                market: {type: string, maxLength: 60, description: Market label stored on the report.}
                pow: {$ref: '#/components/schemas/Pow'}
      responses:
        '200':
          description: This project was already investigated in the last 30 days.
          content:
            application/json:
              schema:
                type: object
                required: [ok, ref, reused]
                properties:
                  ok: {type: boolean, const: true}
                  ref: {$ref: '#/components/schemas/ReportRef'}
                  reused: {type: boolean, const: true}
        '202':
          description: A new investigation was started. The report page is `/r/{ref}` and live progress is `/api/investigate/{ref}/events`.
          content:
            application/json:
              schema:
                type: object
                required: [ok, ref]
                properties:
                  ok: {type: boolean, const: true}
                  ref: {$ref: '#/components/schemas/ReportRef'}
        '400':
          description: '"Name the project, in 3 to 120 characters."'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/OriginNotAllowed'}
        '428':
          description: The proof of work is missing or not accepted. Unlike `POST /api/research`, no `reason` is returned.
          content:
            application/json:
              schema:
                type: object
                required: [ok, code, error]
                properties:
                  ok: {type: boolean, const: false}
                  code: {type: string, const: challenge}
                  error: {type: string}
        '429':
          description: 'Either `researchLimiter` (JSON message "Too many new searches from this connection. Please try again in an hour.") or too many investigations running ("Many investigations are running. Please try again in a few minutes.").'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: '`code: paused`: research is paused for the market, the daily cap, the per-market cap or the AI daily maximum is reached.'
          content:
            application/json:
              schema:
                type: object
                required: [ok, code, error]
                properties:
                  ok: {type: boolean, const: false}
                  code: {type: string, const: paused}
                  error: {type: string}
