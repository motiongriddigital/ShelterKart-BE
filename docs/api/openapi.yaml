  /api/auth/request-code:
    post:
      operationId: requestSignInCode
      tags: [Accounts]
      summary: Ask for a sign-in code
      description: |
        Sends a six-digit code to the address. The reply is the same whether or not the address has an account. One code a minute and five an hour per address;
        20 requests an hour per IP address. When the proof-of-work guard is on, the body must carry `pow`. A new code replaces the previous one.
        With `ACCOUNTS_DEV_ECHO=on` outside production the reply also carries `devCode`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, maxLength: 254}
                language: {type: string, description: 'Optional, for later use.'}
                pow: {type: object, description: 'The solved proof of work, as for POST /api/investigate.'}
      responses:
        '202':
          description: Code sent (or silently not sent if the mail provider failed; the reply is the same).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  cooldownSeconds: {type: integer, example: 60}
                  codeLength: {type: integer, example: 6}
                  devCode: {type: string, description: 'Only with ACCOUNTS_DEV_ECHO outside production.'}
        '400': {description: 'code `invalid_email`.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '428': {description: 'code `challenge`: complete the proof of work and repeat.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: 'code `cooldown` or `rate_limited`, with `retryAfter` seconds.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/auth/verify-code:
    post:
      operationId: verifySignInCode
      tags: [Accounts]
      summary: Sign in with the code
      description: |
        A right code starts a session and sets the session cookie. A new address is created at the first success and then needs `termsAccepted: true`;
        without it the answer is 400 `consent_required` and the code stays valid. A code allows five wrong tries.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: {type: string}
                code: {type: string, pattern: '^[0-9]{6}$'}
                termsAccepted: {type: boolean}
                language: {type: string}
      responses:
        '200':
          description: Signed in. `Set-Cookie` carries the session.
          headers:
            Set-Cookie: {schema: {type: string}, description: '`__Host-sk_session` (production) or `sk_session`: HttpOnly, SameSite=Lax, Path=/, Secure in production, Max-Age 30 days.'}
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  isNewUser: {type: boolean}
                  user: {$ref: '#/components/schemas/User'}
        '400': {description: 'code `invalid_code` (with `attemptsLeft` when known) or `consent_required`.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: 'code `account_disabled`.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: 'code `too_many_attempts` or `rate_limited`.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/auth/logout:
    post:
      operationId: signOut
      tags: [Accounts]
      summary: End this session
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Signed out; the cookie is cleared., content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
  /api/auth/logout-all:
    post:
      operationId: signOutEverywhere
      tags: [Accounts]
      summary: End every session of this user
      security: [{sessionCookie: []}]
      responses:
        '200': {description: All sessions ended; the cookie is cleared., content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
  /api/me:
    get:
      operationId: getMe
      tags: [Accounts]
      summary: The signed-in user
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: The user. Never cached.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  user: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/AuthRequired'}
    patch:
      operationId: updateMe
      tags: [Accounts]
      summary: Change the profile
      description: 'Accepts `displayName` (80 characters), `country` (two letters), `language`, and `phone` together with `whatsappConsent` set to true. Anything else is ignored; the e-mail cannot be changed.'
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: {type: string, maxLength: 80}
                country: {type: string, minLength: 2, maxLength: 2}
                language: {type: string}
                phone: {type: string, description: 'Seven to fifteen digits, an optional leading +. An empty string removes it.'}
                whatsappConsent: {type: boolean}
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  user: {$ref: '#/components/schemas/User'}
        '400': {description: 'code `invalid_country`, `invalid_language`, `invalid_phone` or `consent_required`.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
    delete:
      operationId: deleteMe
      tags: [Accounts]
      summary: Delete the account
      description: 'Needs `{ "confirm": "DELETE" }`. Ends every session and erases the person''s data. Purchase records stay without identity. Paid reports no longer open.'
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: {type: string, enum: [DELETE]}
      responses:
        '200': {description: Deleted; the cookie is cleared., content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '400': {description: 'code `confirm_required`.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
  /api/me/reports:
    get:
      operationId: getMyReports
      tags: [Accounts]
      summary: My reports
      description: Reports the user opened or bought, newest first, at most 100. A report is `paid` while a paid, not refunded purchase exists.
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  reports:
                    type: array
                    items:
                      type: object
                      properties:
                        ref: {type: string}
                        projectName: {type: [string, 'null']}
                        market: {type: [string, 'null']}
                        paid: {type: boolean}
                        purchasedAt: {type: [string, 'null'], format: date-time}
                        amount: {type: [number, 'null']}
                        currency: {type: [string, 'null']}
                        firstOpenedAt: {type: string, format: date-time}
                        lastOpenedAt: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/AuthRequired'}
  /api/me/export:
    get:
      operationId: exportMyData
      tags: [Accounts]
      summary: Download my data
      description: 'The user, consents, active sessions (without secrets), reports and purchases as one JSON file (`Content-Disposition: attachment`).'
      security: [{sessionCookie: []}]
      responses:
        '200': {description: The file., content: {application/json: {schema: {type: object, description: 'Shape: ok, exportedAt, user, consents, sessions, reports, purchases.'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-sk_session
      description: 'The session cookie set by `POST /api/auth/verify-code` (named `sk_session` outside production). HttpOnly: page scripts cannot read it; the browser sends it on its own. Present only with `ACCOUNTS_ENABLED=on`.'
    accessToken:
      type: apiKey
      in: header
      name: X-Report-Access
      description: |
        A signed access token for one report: `payload.signature`, HMAC-SHA256 with `ACCESS_TOKEN_SECRET`, tied to one report reference, valid 30 days.
        Issued by `POST /api/research/razorpay/verify`, `POST /api/research/access` and `POST /api/research/recover`, and embedded in the link delivered to the buyer.
        It is optional on the routes that accept it: without a valid token the report is the free preview.
    accessTokenQuery:
      type: apiKey
      in: query
      name: t
      description: The same access token, passed as the `t` query parameter. Used by the server-rendered report pages and the event stream.
    adminBasic:
      type: http
      scheme: basic
      description: |
        HTTP Basic against `ADMIN_USERNAME` and `ADMIN_PASSWORD` (compared in constant time). If either variable is unset every admin route answers 503.
        Every route under `/api/admin` is also behind `adminLimiter`: 20 requests per 15 minutes per IP, counting successful requests.
    razorpayWebhookSignature:
      type: apiKey
      in: header
      name: X-Razorpay-Signature
      description: HMAC-SHA256 hex digest of the exact raw request body, keyed with `RAZORPAY_WEBHOOK_SECRET`.
    morWebhookSignature:
      type: apiKey
      in: header
      name: webhook-signature
      description: |
        Standard Webhooks signature, `v1,<base64 HMAC-SHA256>` over `{webhook-id}.{webhook-timestamp}.{raw body}`, keyed with `DODO_WEBHOOK_KEY`.
        Space-separated lists of signatures are accepted. The `webhook-id` and `webhook-timestamp` headers are also required.
    genericWebhookSignature:
      type: apiKey
      in: header
      name: X-SK-Signature
      description: HMAC-SHA256 hex digest of the exact raw request body, keyed with `PAYMENT_WEBHOOK_SECRET`.
  parameters:
    RefPath:
      name: ref
      in: path
      required: true
      description: Report reference.
      schema: {$ref: '#/components/schemas/ReportRef'}
    XReportAccess:
      name: X-Report-Access
      in: header
      required: false
      description: Access token for the report. Without a valid one the report is the preview when payments are active.
      schema: {type: string}
    LangQuery:
      name: lang
      in: query
      required: false
      description: Reader language code from `GET /api/languages`. Unknown or disabled codes fall back to English.
      schema: {type: string}
    CountryQuery:
      name: country
      in: query
      required: false
      description: ISO 3166 alpha-2 code of the buyer's selected country. Decides currency, tax and payment route, never the dollar value of the fee.
      schema: {type: string, pattern: '^[A-Za-z]{2}$'}
    SessionQuery:
      name: session
      in: query
      required: false
      description: Opaque browser session id used to group quotes.
      schema: {type: string}
    TokenQuery:
      name: t
      in: query
      required: false
      description: Access token for the report.
      schema: {type: string}
    SampleId:
      name: id
      in: path
      required: true
      description: Sample id. The ids shipped in this repository are celeste, dubai and london.
      schema: {type: string, pattern: '^[a-z0-9-]{2,40}$'}
    UuidPath:
      name: id
      in: path
      required: true
      description: A UUID of version 1 to 5.
      schema: {type: string, format: uuid}
    JobIdPath:
      name: id
      in: path
      required: true
      description: Job id returned by `POST /api/admin/investigate`.
      schema: {type: string}
  responses:
    AuthRequired:
      description: 'No valid session. Body `{ "ok": false, "code": "auth_required", "error": "Sign in to continue." }`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    OriginNotAllowed:
      description: 'The request carried an `Origin` header that is not in `ALLOWED_ORIGINS`. The body is `{ "ok": false, "error": "Origin not allowed" }`. Applies to every route.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimitedJson:
      description: Rate limit reached. The limiter's own JSON message is returned.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimitedText:
      description: 'Rate limit reached. This limiter has no custom message, so the body is the plain text "Too many requests, please try again later." with `RateLimit-*` and `Retry-After` headers.'
      content:
        text/html:
          schema: {type: string}
    PaymentsDisabled:
      description: '"Payments are not enabled yet."'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AdminUnauthorized:
      description: 'Missing or wrong Basic credentials: "Authentication required" or "Invalid credentials". The response carries `WWW-Authenticate: Basic realm="ShelterKart Admin"`.'
      headers:
        WWW-Authenticate:
          schema: {type: string, examples: ['Basic realm="ShelterKart Admin"']}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AdminNotConfigured:
      description: '"Admin access is not configured." (`ADMIN_USERNAME` or `ADMIN_PASSWORD` is unset)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Retired:
      description: '"This endpoint has been retired."'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    User:
      type: object
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        displayName: {type: [string, 'null']}
        country: {type: [string, 'null']}
        language: {type: [string, 'null']}
        phone: {type: [string, 'null']}
        createdAt: {type: [string, 'null'], format: date-time}
    Error:
      type: object
      required: [ok, error]
      properties:
        ok: {type: boolean, const: false}
        error: {type: string}
        code: {type: string}
    Ok:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean, const: true}
    ReportRef:
      type: string
      pattern: '^SK-[0-9A-F]{12}$'
      examples: [SK-2AADD4DEE5DD]
    Market:
      type: string
      description: A research market code (backend/engine/markets.js).
      enum: [uk, fr, 'no', sg, ie, tw, au, fi, cz, ee, lv, pl, es, lt, dk, ch, be, se, ae, in, hk, nz, ca, my, us, de, nl, pt, it, sa, za, br, mx, jp, th, ph]
    Pow:
      type: object
      description: A solved proof-of-work challenge from `GET /api/research/challenge`.
      required: [token, solution]
      properties:
        token: {type: string, maxLength: 400}
        solution: {type: string, pattern: '^[0-9a-z]{1,16}$'}
    ResearchRequest:
      type: object
      required: [query, market]
      properties:
        query: {type: string, minLength: 2, maxLength: 120, description: 'A property or developer name, a spelling variant, or a registration number.'}
        location: {type: string, maxLength: 80}
        market: {$ref: '#/components/schemas/Market'}
        lang: {type: string, description: Reader language code.}
        country: {type: string, description: 'Buyer''s selected country (ISO alpha-2), used for the price in `paywall`.'}
        session: {type: string}
        pow: {$ref: '#/components/schemas/Pow'}
    Paywall:
      type: object
      required: [active]
      description: |
        `{ "active": false }` when payments are off. When active: the fee for this buyer, read in the buyer's currency. Nothing is stored or locked here; a quote is issued on unlock.
      properties:
        active: {type: boolean}
        price: {type: number, description: The gross price in the buyer's currency.}
        currency: {type: string}
        depth: {type: string, enum: [gold, heavy, thin]}
        depthLabel: {type: string}
        basis:
          type: object
          description: 'How the fee was set: `kind` (`property` or `reference`) and, for `property`, the property value used. Shape not fully documented.'
          additionalProperties: true
        fee:
          type: object
          properties:
            net: {type: number}
            tax: {type: number}
            taxName: {type: string}
            taxRateBps: {type: integer}
            taxInclusive: {type: boolean}
        buyer:
          type: object
          description: 'country, source (billing, selected, network or default), currency, fallback, onSale, reason and wanted. Shape not fully documented.'
          additionalProperties: true
        priceBookVersion: {type: string}
    Brief:
      type: object
      additionalProperties: true
      description: |
        A report. Shape not fully documented: it is large, its nested objects are produced by the research engine, the grounding gate and the adviser, and it differs by `kind`.

        For a search report (no `kind`), `runResearch` builds: version, ref, query, location, market, marketLabel, depth, marketNote, checkedAt, project, registry, counts, findings, conflicts, gaps,
        reading, questions, removed, searches, pages, notes, pipeline_status, responsible, disclaimer and protections. `cached` and `matchedAs` are added when served from memory, `credits` is
        added by the credits layer, and `held` replaces adverse findings while a person checks them.

        For an investigator report (`kind: dossier`) the stored record holds kind, ref, phase, query (prefixed `dossier:`), location, market, marketLabel, project, findings, conflicts, checkedAt, dossier, and contact when saved.

        When the caller is not entitled, the brief is an allow-list preview: `locked: true`, at most 3 findings and 2 questions, empty `reading` and `pages`, `protectionsCount` instead of `protections`, and `lockedCounts`.
        When entitled (or payments are off) `locked` is false. The preview is a projection of the search-report fields above, so an unpaid dossier report exposes only the fields in that projection.
      properties:
        ref: {$ref: '#/components/schemas/ReportRef'}
        kind: {type: string, const: dossier}
        query: {type: string}
        location: {type: string}
        market: {type: string}
        marketLabel: {type: string}
        checkedAt: {type: string, format: date-time}
        locked: {type: boolean}
        project: {type: object, additionalProperties: true}
        findings: {type: array, items: {type: object, additionalProperties: true}}
        conflicts: {type: array, items: {type: object, additionalProperties: true}}
        questions: {type: array, items: {type: object, additionalProperties: true}}
    BriefResponse:
      type: object
      required: [ok, brief, paywall]
      properties:
        ok: {type: boolean, const: true}
        brief: {$ref: '#/components/schemas/Brief'}
        paywall: {$ref: '#/components/schemas/Paywall'}
    Quote:
      type: object
      description: The quote as the page needs it. The signature and the property value are never sent.
      required: [id, ref, country, currency, net, tax, gross, expiresAt]
      properties:
        id: {type: string, pattern: '^q_[0-9a-f]{20}$'}
        ref: {$ref: '#/components/schemas/ReportRef'}
        country: {type: string}
        countrySource: {type: string, description: 'billing, selected, network or default.'}
        currency: {type: string}
        net: {type: number}
        tax: {type: number}
        gross: {type: number, description: The total that is charged.}
        taxName: {type: string}
        taxRateBps: {type: integer}
        taxInclusive: {type: boolean}
        taxBy: {type: string, enum: [shelterkart, merchant_of_record]}
        depthLabel: {type: string}
        priceBookVersion: {type: string}
        issuedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    CheckoutResponse:
      type: object
      required: [ok, purchaseId, amount, currency]
      properties:
        ok: {type: boolean, const: true}
        purchaseId: {type: string, format: uuid}
        amount: {type: number, description: The quote's gross total in major units.}
        currency: {type: string}
        quoteId: {type: string, description: Absent when a pending Razorpay purchase is returned for a retried idempotency key.}
        razorpay:
          type: object
          description: Present when the provider is Razorpay. Open Razorpay Checkout with these values.
          required: [keyId, orderId, amountSubunits]
          properties:
            keyId: {type: string}
            orderId: {type: string}
            amountSubunits: {type: integer}
        mor:
          type: object
          description: Present when the provider is the Merchant of Record. Send the buyer to `checkoutUrl`; they return to `PUBLIC_BASE_URL/?sk_ref=<ref>&sk_purchase=<purchaseId>`.
          required: [checkoutUrl]
          properties:
            checkoutUrl: {type: string, format: uri}
    CheckoutError:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean, const: false}
        error: {type: string}
        code:
          type: string
          description: 'quote_required, quote_unknown, quote_expired, quote_superseded, quote_used, quote_signature, billing_required, billing_country or not_on_sale.'
        requote: {type: boolean, description: 'True when the page should fetch a fresh quote and show the price again.'}
        reason: {type: string, description: 'Present with `not_on_sale`.'}
        country: {type: string}
        previous:
          type: object
          description: With `billing_country`, the quote the buyer was shown.
          properties:
            country: {type: string}
            currency: {type: string}
            gross: {type: number}
        quote: {$ref: '#/components/schemas/Quote'}
    TokenResponse:
      type: object
      required: [ok, token]
      properties:
        ok: {type: boolean, const: true}
        token: {type: string, description: 'An access token for the report. Send it as `X-Report-Access` or as `t`.'}
    WebhookAck:
      type: object
      required: [ok]
      description: The acknowledgement. Which extra flag is present depends on what the handler did; see the operation.
      properties:
        ok: {type: boolean, const: true}
        ignored: {type: string, description: The event name that is not acted on.}
        duplicate: {type: boolean}
        unknown_order: {type: boolean}
        unknown_purchase: {type: boolean}
        unmatched: {type: boolean}
        mismatch: {type: boolean}
        noted: {type: string}
