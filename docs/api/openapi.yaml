openapi: 3.1.0
info:
  title: ShelterKart API
  version: 1.0.0
  summary: HTTP contract of backend/server.js
  description: |
    This contract describes every route registered in `backend/server.js` as of the commit it was written against.
    It was written from the code, then checked against a locally running server for status codes and error bodies
    that do not need a database, an AI engine or a payment provider. Where a response is large, nested or depends on
    data that could not be exercised, the description says "shape not fully documented" instead of guessing.

    Conventions that hold for the whole API:

    - JSON error bodies are `{ "ok": false, "error": "<message>" }`, sometimes with a `code` and other fields.
      Most successful JSON bodies carry `"ok": true`. The exceptions are called out per operation.
    - A request whose `Origin` header is not in `ALLOWED_ORIGINS` is refused with 403 `{ "ok": false, "error": "Origin not allowed" }`
      before any route runs. In production an empty `ALLOWED_ORIGINS` refuses every request that carries an `Origin` header.
      Requests without an `Origin` header (curl, server to server, same-origin navigations) are not affected.
      Browsers add an `Origin` header to every cross-origin request and to same-origin POST requests, so a page served by this
      API that posts back to it needs the API's own origin in `ALLOWED_ORIGINS` as well. See README.md in this folder.
    - The global JSON body parser accepts bodies up to 10 kb. Malformed JSON and bodies over the limit are not turned into
      400 or 413: they reach the generic error handler and return 500 `{ "ok": false, "error": "Internal server error" }`.
      The routes that have their own body parser are `POST /api/research/document-check` (12 mb JSON),
      `POST /api/admin/investigate` (20 kb JSON) and the three webhooks (raw body, 1 mb).
    - A path that matches no route returns Express's default 404 HTML page (`Cannot GET /path`), not JSON.
    - Rate limiters count every request that reaches them, including requests that go on to fail validation.
      The JSON limiters answer 429 `{ "ok": false, "error": "..." }`. The limiters without a custom message
      (`checkoutResearchLimiter`, `trackLimiter`) answer 429 with the plain text `Too many requests, please try again later.`
    - Report references look like `SK-` followed by 12 upper-case hex characters.
    - User accounts (`ACCOUNTS_ENABLED=on`, see docs/accounts/TDD.md). With accounts on, these routes answer 401 `{ "ok": false, "code": "auth_required" }` without a valid session cookie:
      `POST /api/research`, `POST /api/research/quote`, `POST /api/research/checkout`, `POST /api/research/razorpay/verify`, `POST /api/research/access`,
      `POST /api/research/document-check`, `GET /api/research/by-ref/{ref}`, `POST /api/investigate/{ref}/contact`, `GET /api/investigate/{ref}/events`,
      `GET /r/{ref}/pdf`, and, with `ACCOUNTS_SEARCH_GATE=start`, `POST /api/investigate`. `GET /r/{ref}` answers 302 to `/signin?next=...`.
      Full report access then follows the signed-in user's paid purchase, not an access token: the `accessToken` schemes below apply only with accounts off,
      the verify and access replies carry `entitled: true` instead of `token`, and `POST /api/research/recover` answers 410 `use_account`.
      With accounts off nothing in this paragraph applies and the Accounts routes do not exist.
    - Payments are switched on only when `PAYMENTS_ENABLED=true`, `ACCESS_TOKEN_SECRET` and the Razorpay key pair are all set.
      Until then the payment routes answer 503 `Payments are not enabled yet.` and no report is locked.
servers:
  - url: '{apiBase}'
    description: The API origin. Set the website's API_BASE to the same value.
    variables:
      apiBase:
        default: http://localhost:4000
        description: The origin the backend is served from, with no trailing slash. The server listens on PORT, default 4000.
tags:
  - name: Health
    description: Liveness and reference data.
  - name: Accounts
    description: Sign-in by e-mail code, the session cookie, the signed-in user's profile, reports, export and deletion. Present only when `ACCOUNTS_ENABLED=on`.
  - name: Research
    description: The search flow, quotes, checkout and access tokens.
  - name: Investigate
    description: The questions-first investigator used by the buyer flow.
  - name: Pages
    description: Server-rendered HTML pages and PDFs, opened by navigation rather than called from the website script.
  - name: Webhooks
    description: Payment provider callbacks. They use the raw request body for signature verification.
  - name: Tracking
    description: Browser analytics events.
  - name: Reply
    description: Disputes and the developer right of reply.
  - name: Admin
    description: Operator routes behind HTTP Basic authentication and the admin rate limiter.
  - name: SEO
    description: robots.txt and sitemap.xml.
  - name: Retired
    description: Routes that always answer 410.
paths:
  /api/health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Liveness check
      description: Returns the service name and the server time. Used by the CI smoke test.
      security: []
      x-source: backend/server.js:118
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, time]
                properties:
                  ok: {type: boolean, const: true}
                  service: {type: string, const: shelterkart-api}
                  time: {type: string, format: date-time}
        '403': {$ref: '#/components/responses/OriginNotAllowed'}
  /api/markets:
    get:
      operationId: listMarkets
      tags: [Health]
      summary: List the 36 research markets
      description: |
        Returns a bare JSON array (no `ok` wrapper). `depth` is `Research` for a market whose official register is currently
        switched off by the source health check, otherwise the market's own depth label. `note` is replaced by a fixed sentence
        in that case. The `status` values are those in backend/engine/markets.js and are not enumerated here.
      security: []
      x-source: backend/server.js:1113
      responses:
        '200':
          description: One entry per market.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [code, label, status, depth, note]
                  properties:
                    code: {$ref: '#/components/schemas/Market'}
                    label: {type: string}
                    status: {type: string}
                    depth: {type: string}
                    note: {type: string}
        '403': {$ref: '#/components/responses/OriginNotAllowed'}
  /api/languages:
    get:
      operationId: listLanguages
      tags: [Health]
      summary: List reader languages and each market's languages
      description: Cached for one hour (`Cache-Control public, max-age=3600`).
      security: []
      x-source: backend/server.js:1019
      responses:
        '200':
          description: Enabled languages, and for each market code the language codes its buyers use (enabled ones first).
          content:
            application/json:
              schema:
                type: object
                required: [ok, languages, markets]
                properties:
                  ok: {type: boolean, const: true}
                  languages:
                    type: array
                    items:
                      type: object
                      properties:
                        code: {type: string, examples: [hi]}
                        native: {type: string}
                        name: {type: string}
                        dir: {type: string, enum: [ltr, rtl]}
                        locale: {type: string, examples: [hi-IN]}
                        review: {type: string, description: 'Review state of the translation. Values seen: native, ai.'}
                  markets:
                    type: object
                    description: Market code to an ordered list of language codes.
                    additionalProperties:
                      type: array
                      items: {type: string}
        '403': {$ref: '#/components/responses/OriginNotAllowed'}
  /api/pricing/countries:
    get:
      operationId: listPricingCountries
      tags: [Research]
      summary: Countries a buyer can be in, and whether reports are on sale there
      description: |
        Feeds the country selector. Never cached (`Cache-Control no-store`) because `network` depends on the visitor.
        Blocked countries are left out. The list is sorted by name.
      security: []
      x-source: backend/server.js:448
      responses:
        '200':
          description: The country list.
          content:
            application/json:
              schema:
                type: object
                required: [ok, countries, network, priceBookVersion]
                properties:
                  ok: {type: boolean, const: true}
                  countries:
                    type: array
                    items:
                      type: object
                      required: [iso, name, currency, onSale]
                      properties:
                        iso: {type: string, pattern: '^[A-Z]{2}$'}
                        name: {type: string}
                        currency: {type: string, examples: [INR]}
                        onSale: {type: boolean}
                        reason:
                          type: [string, 'null']
                          description: 'Why the country is not on sale. Values seen in a running server: no_payment_route, registration_required, unverified. Other values come from backend/pricing/data.js and are not enumerated.'
                  network:
                    type: string
                    description: The visitor's country from the hosting network's header (cf-ipcountry, x-vercel-ip-country, cloudfront-viewer-country or fly-client-country), or an empty string.
                  priceBookVersion: {type: string, examples: ['2026-10.2']}
        '403': {$ref: '#/components/responses/OriginNotAllowed'}
  /api/research/challenge:
    get:
      operationId: getResearchChallenge
      tags: [Research]
      summary: Get a proof-of-work challenge for a new search
      description: |
        The browser solves it and sends the result as `pow` on `POST /api/research` or `POST /api/investigate`.
        The token is signed, expires in five minutes and is accepted once. Difficulty rises when the day's research allowance is
        half and eighty percent used. Fetching one costs nothing. Always answers 200, even when the bot guard is off.
        Limited by `trackLimiter` (60 requests per minute per IP).
      security: []
      x-rate-limit: trackLimiter
      x-source: backend/server.js:1123
      responses:
        '200':
          description: A challenge.
          content:
            application/json:
              schema:
                type: object
                required: [ok, token, bits, expiresAt]
                properties:
                  ok: {type: boolean, const: true}
                  token: {type: string}
                  bits: {type: integer, description: 'Leading zero bits required: SHA-256(token + ":" + solution).'}
                  expiresAt: {type: string, format: date-time}
        '403': {$ref: '#/components/responses/OriginNotAllowed'}
        '429': {$ref: '#/components/responses/RateLimitedText'}
  /api/research:
    post:
      operationId: runResearch
      tags: [Research]
      summary: Search for a project or developer and get its brief
      description: |
        Runs a new search or serves one already researched (exact spelling, another spelling, or a registration number).
        Only new research costs money, so only new research needs `pow` when the bot guard is on
        (`BOT_GUARD`, default on in production). Searches answerable from memory are exempt from `researchLimiter`, and with the bot guard on a request
        that carries no `pow` token is not counted either (it is refused before any cost).
        Phone numbers and e-mail addresses in `query` and `location` are removed before the query leaves the process.
        The response is not cached (`Cache-Control no-store`, `X-Robots-Tag noindex, nofollow`).
        When payments are active and the caller does not send a valid `X-Report-Access` token for this report, the brief is the
        allow-listed preview with `locked: true`.
        When `lang` names an enabled language other than English the brief is translated after gating; a translation failure falls back to English.
        The price shown in `paywall` uses `country` from the body (or the query string), else the network's suggestion.
      security:
        - {}
        - accessToken: []
      x-rate-limit: researchLimiter
      x-source: backend/server.js:1129
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResearchRequest'}
      responses:
        '200':
          description: The brief and the paywall state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BriefResponse'}
        '400':
          description: 'Validation failed. Messages: "Enter a property or developer name between 2 and 120 characters.", "Location is too long." (over 80 characters), "Unknown market."'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/OriginNotAllowed'}
        '428':
          description: A new search needs the proof of work and `pow` was missing or not accepted.
          content:
            application/json:
              schema:
                type: object
                required: [ok, code, reason, error]
                properties:
                  ok: {type: boolean, const: false}
                  code: {type: string, const: challenge}
                  reason: {type: string, enum: [missing, malformed, tampered, expired, used, not_solved]}
                  error: {type: string}
        '429': {$ref: '#/components/responses/RateLimitedJson'}
        '500':
          description: 'Unexpected failure: "Research failed. Please try again."'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: 'Research is paused (RESEARCH_PAUSED, a zero daily cap, or the market is in RESEARCH_MARKETS_OFF), the daily cap is used up, or neither the web search nor the register could complete. The message says which. No `code` field is returned.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/research/by-ref/{ref}:
    get:
      operationId: getReportByRef
      tags: [Research]
      summary: Open the exact report behind a shared link
      description: |
        Serves the stored report, gated the same way as `POST /api/research`. Records a `report_open` analytics event.
        Not cached (`Cache-Control no-store`, `X-Robots-Tag noindex, nofollow`). Shares `researchLimiter` with the other routes that use it,
        so these requests count toward the same per-IP hourly limit. The limiter's skip rule never skips a GET, so every call counts.
      security:
        - {}
        - accessToken: []
      x-rate-limit: researchLimiter
      x-source: backend/server.js:1024
      parameters:
        - {$ref: '#/components/parameters/RefPath'}
        - {$ref: '#/components/parameters/XReportAccess'}
        - {$ref: '#/components/parameters/LangQuery'}
        - {$ref: '#/components/parameters/CountryQuery'}
        - {$ref: '#/components/parameters/SessionQuery'}
      responses:
        '200':
          description: The brief and the paywall state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BriefResponse'}
        '400':
          description: 'The reference is malformed: "Not a valid report reference."'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/OriginNotAllowed'}
        '404':
          description: 'No such report is held: "This report is no longer available. Search again for the latest information."'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimitedJson'}
  /api/research/quote:
    post:
      operationId: issueQuote
      tags: [Research]
      summary: Issue a signed price for a report and a buyer
      description: |
        Returns a quote locked for 30 minutes (the price book's `quoteMinutes`, default 30). Any earlier open quote for the same report and
        session is superseded. The price is set by the property and the evidence depth, never by the browser. The buyer is resolved from
        `billingCountry`, then `country`, then the network's suggestion. Not cached (`Cache-Control no-store`).
        Step 2 of the sale described in HANDOVER.md section 1.
      security: []
      x-rate-limit: researchLimiter
      x-source: backend/server.js:459
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref]
              properties:
                ref: {$ref: '#/components/schemas/ReportRef'}
                previousQuoteId:
                  type: string
                  pattern: '^q_[0-9a-f]{20}$'
                  description: The quote being replaced after the buyer changed country. Recorded as a `country_changed` event.
                billingCountry: {type: string, description: 'ISO 3166 alpha-2 code. Takes precedence over `country`.'}
                country: {type: string, description: ISO 3166 alpha-2 code the buyer selected.}
                session: {type: string, description: 'Opaque browser session id. Characters other than letters, digits, underscore and hyphen are removed, truncated to 64; empty becomes "anon".'}
      responses:
        '200':
          description: The quote.
          content:
            application/json:
              schema:
                type: object
                required: [ok, quote]
                properties:
                  ok: {type: boolean, const: true}
                  quote: {$ref: '#/components/schemas/Quote'}
        '400':
          description: 'The reference is malformed: "Unknown report reference."'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/OriginNotAllowed'}
        '404':
          description: 'The report is not held: "This report is no longer available. Search again, then unlock the new report."'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: |
            The quote cannot be issued. `code` is `held` (adverse findings wait for a person), `not_ready` (a dossier whose first findings are
            still coming in), `country_required` (no usable country signal), or `not_on_sale` (with `reason` and `country`).
          content:
            application/json:
              schema:
                type: object
                required: [ok, code, error]
                properties:
                  ok: {type: boolean, const: false}
                  code: {type: string, enum: [held, not_ready, country_required, not_on_sale]}
                  reason: {type: string, description: 'Present for not_on_sale. Reason values come from backend/pricing/data.js (for example no_payment_route, registration_required, unverified, threshold_reached).'}
                  country: {type: string}
                  error: {type: string}
        '429': {$ref: '#/components/responses/RateLimitedJson'}
  /api/research/checkout:
    post:
      operationId: startCheckout
      tags: [Research]
      summary: Start a purchase for a quoted report
      description: |
        Step 3 of the sale. Stores a pending purchase and opens a payment with the provider chosen by data for the buyer's country:
        Razorpay (India) or the Merchant of Record (Dodo Payments). The amount is the quote's gross total, never anything the browser sent.
        Only a signed webhook (or, for the merchant, the server's own check of the merchant's records) marks a purchase paid.

        Idempotency: the same `idempotencyKey` returns the same purchase. A retry of a pending Razorpay purchase returns the stored order
        (without `quoteId`). A retry of a pending merchant purchase opens a fresh single-use session for the same purchase. A retry of a purchase that is
        no longer pending, or whose order step never completed, is a 409.

        Billing country check: if `billingCountry` differs from the quote's country the call returns 409 `billing_country` with a new quote to confirm.
        Which provider is used is data driven (`backend/data/payment-routes.json`); the merchant route needs `PUBLIC_BASE_URL`.
      security: []
      x-rate-limit: checkoutResearchLimiter
      x-source: backend/server.js:339
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref, idempotencyKey]
              properties:
                ref: {$ref: '#/components/schemas/ReportRef'}
                idempotencyKey: {type: string, pattern: '^[A-Za-z0-9_-]{16,64}$'}
                quoteId:
                  type: string
                  pattern: '^q_[0-9a-f]{20}$'
                  description: Required unless the idempotency key was already used for a pending purchase.
                billingCountry: {type: string, description: ISO 3166 alpha-2 code. Required unless the idempotency key was already used.}
                buyerKind: {type: string, enum: [individual, business], description: 'Anything other than "business" is treated as individual.'}
                taxId: {type: string, description: 'Kept for the invoice, not validated, and changes no tax. Cleaned to at most 20 letters and digits.'}
                lang: {type: string, description: 'Reader language, recorded on the `checkout_started` event only.'}
      responses:
        '200':
          description: The purchase and the provider's payment details. Exactly one of `razorpay` or `mor` is present.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckoutResponse'}
        '400':
          description: |
            Invalid request. `code` is absent for "Unknown report reference." and "Missing or invalid idempotency key.", and one of
            `quote_required`, `billing_required`, `quote_signature` otherwise.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckoutError'}
        '403': {$ref: '#/components/responses/OriginNotAllowed'}
        '404':
          description: '`quote_unknown` (with `requote: true`), or the report is no longer held (no `code`).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckoutError'}
        '409':
          description: |
            `quote_expired`, `quote_superseded` or `quote_used` (with `requote: true`); `billing_country` (with `requote: true`, `previous` and a new `quote`);
            `not_on_sale` (with `reason` and `country`); or no `code` for "This checkout attempt has already been used. Please start again."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckoutError'}
        '429': {$ref: '#/components/responses/RateLimitedText'}
        '503':
          description: 'Payments are not enabled yet; `not_on_sale` with `reason: no_payment_route`; or "Payment could not be started right now. Please try again in a moment." when the provider call failed.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckoutError'}
  /api/research/razorpay/verify:
    post:
      operationId: verifyRazorpayPayment
      tags: [Research]
      summary: Confirm a Razorpay payment from the browser and receive an access token
      description: |
        The checkout success handler. The signature is checked against the order id stored on the server for this purchase, so a browser cannot pair a real
        payment with someone else's order. Marks the purchase paid if the webhook has not already done so. Calling it for an already paid purchase returns a token again.
      security: []
      x-rate-limit: checkoutResearchLimiter
      x-source: backend/server.js:882
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref, purchaseId, razorpay_payment_id, razorpay_signature]
              properties:
                ref: {$ref: '#/components/schemas/ReportRef'}
                purchaseId: {type: string, format: uuid}
                razorpay_payment_id: {type: string, pattern: '^pay_\w+$'}
                razorpay_signature: {type: string}
      responses:
        '200':
          description: The payment is verified.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400':
          description: '"Invalid request." (field formats) or "This payment could not be verified. If you were charged, write to us with your receipt."'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/OriginNotAllowed'}
        '404':
          description: '"Purchase not found." (unknown purchase, wrong report, or no stored order id)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimitedText'}
        '503': {$ref: '#/components/responses/PaymentsDisabled'}
  /api/research/access:
    post:
      operationId: exchangePurchaseForToken
      tags: [Research]
      summary: Exchange a paid purchase for an access token
      description: |
        The purchase id is a random UUID known only to the buyer who started it. For a pending merchant purchase the server first asks the merchant for the
        session and payment records and settles the purchase if the payment succeeded for exactly the quoted amount and currency (the buyer's return before the webhook).
      security: []
      x-rate-limit: checkoutResearchLimiter
      x-source: backend/server.js:983
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref, purchaseId]
              properties:
                ref: {$ref: '#/components/schemas/ReportRef'}
                purchaseId: {type: string, format: uuid}
      responses:
        '200':
          description: The purchase is paid.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400':
          description: '"Invalid request."'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '402':
          description: '"Payment has not been confirmed yet." Also returned when the purchase is unknown.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/OriginNotAllowed'}
        '429': {$ref: '#/components/responses/RateLimitedText'}
        '503': {$ref: '#/components/responses/PaymentsDisabled'}
  /api/research/recover:
    post:
      operationId: recoverAccess
      tags: [Research]
      summary: Recover access with the payment id from a receipt
      description: For a buyer who paid on another device or cleared their browser. Looks up a paid purchase by the provider's payment id and issues a token.
      security: []
      x-rate-limit: checkoutResearchLimiter
      x-source: backend/server.js:1073
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentId]
              properties:
                paymentId: {type: string, pattern: '^pay_[A-Za-z0-9]{8,30}$', description: The Razorpay payment id from the receipt.}
      responses:
        '200':
          description: A paid purchase matches.
          content:
            application/json:
              schema:
                type: object
                required: [ok, ref, token]
                properties:
                  ok: {type: boolean, const: true}
                  ref: {$ref: '#/components/schemas/ReportRef'}
                  token: {type: string}
        '400':
          description: 'The id does not look like a Razorpay payment id: "Enter the payment ID from your Razorpay receipt. It starts with pay_."'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/OriginNotAllowed'}
        '404':
          description: '"No paid ShelterKart report matches that payment ID. If you were charged, write to us with your receipt."'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimitedText'}
        '503': {$ref: '#/components/responses/PaymentsDisabled'}
  /api/research/document-check:
    post:
      operationId: checkDocument
      tags: [Research]
      summary: Check a buyer's own document against the research
      description: |
        The document is never stored, logged or cached. The route runs (or reuses) the research for `query`, applies the paywall, then reads the document with an AI engine
