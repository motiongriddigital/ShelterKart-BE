services:
  db:
    image: postgres:16
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: shelterkart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the host .env}
      POSTGRES_DB: shelterkart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelterkart -d shelterkart"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - dbdata:/var/lib/postgresql/data

  migrate:
    image: ${IMAGE:-ghcr.io/motiongriddigital/shelterkart-be}:${TAG:?set TAG to the image tag to run}
    working_dir: /app
    restart: "no"
    command: ["sh", "-c", "node tools/migrate.js && node tools/seed_pricing.js"]
    environment:
      DATABASE_URL: postgres://shelterkart:${POSTGRES_PASSWORD}@db:5432/shelterkart
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${IMAGE:-ghcr.io/motiongriddigital/shelterkart-be}:${TAG:?set TAG to the image tag to run}
    init: true
    restart: unless-stopped
    mem_limit: 2g
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://shelterkart:${POSTGRES_PASSWORD}@db:5432/shelterkart
      TRUST_PROXY: "1"
      BACKUP_DIR: /app/backend/data/backups
    volumes:
      - livejobs:/app/backend/data/live-jobs
      - backups:/app/backend/data/backups
    depends_on:
      migrate:
        condition: service_completed_successfully

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN to the public host name}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api

volumes:
  dbdata:
  livejobs:
  backups:
  caddydata:
  caddyconfig:
