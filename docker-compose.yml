services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: shelterkart
    ports:
      - "${DB_PORT:-5440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dbdata:/var/lib/postgresql/data

  migrate:
    build: .
    working_dir: /app
    command: ["sh", "-c", "node tools/migrate.js && node tools/seed_pricing.js"]
    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/shelterkart
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    init: true
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:dev@db:5432/shelterkart
      ALLOWED_ORIGINS: http://localhost:3000
    env_file:
      - path: backend/.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  dbdata:
